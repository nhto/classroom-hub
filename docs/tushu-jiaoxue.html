<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謝老師 AI 互動教室｜茶文化圖書教學</title>
<meta name="description" content="古風山水水彩繪本風格入口網頁，整合茶文化互動遊戲、《中國茶》繪本遊戲與繪本影片。">
<script src="https://yiyanstatic.cdn.bcebos.com/advisory/tailwindcss.js"></script>
<style>
:root{
  --ink:#2f3a36;
  --ink-soft:#5b6a63;
  --paper:#f7f2e6;
  --jade:#4f7d6a;
  --moss:#7d9a72;
  --mist:#e7e3d6;
  --clay:#b98a62;
  --plum:#9a6a76;
  --gold:#c19a5b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;max-width:100%;}
body{
  background-color:var(--paper);
  color:var(--ink);
  font-family:"PingFang TC","PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif;
  line-height:1.7;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;}
input{font:inherit;}
.display{
  font-family:"Songti TC","Songti HK","Noto Serif TC","PMingLiU",serif;
  letter-spacing:.06em;
}

/* ---------- 水彩紙張與暈染底層 ---------- */
.paper-layer{position:fixed;inset:0;pointer-events:none;z-index:0;}
.paper-layer .grain{
  position:absolute;inset:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='240' height='240' filter='url(%23g)' opacity='0.16'/></svg>");
  mix-blend-mode:multiply;
}
.paper-layer .fibre{
  position:absolute;inset:0;opacity:.55;
  background-image:
    repeating-linear-gradient(96deg, rgba(120,105,80,.035) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(6deg, rgba(120,105,80,.025) 0 1px, transparent 1px 9px);
}
.wash{position:absolute;border-radius:50%;filter:blur(42px);opacity:.55;mix-blend-mode:multiply;}
.w1{width:62vw;height:42vh;left:-14vw;top:6vh;background:radial-gradient(circle at 50% 50%, rgba(158,186,168,.55), rgba(158,186,168,0) 68%);}
.w2{width:54vw;height:38vh;right:-12vw;top:20vh;background:radial-gradient(circle at 50% 50%, rgba(190,196,214,.5), rgba(190,196,214,0) 70%);}
.w3{width:58vw;height:40vh;left:18vw;bottom:-10vh;background:radial-gradient(circle at 50% 50%, rgba(214,190,160,.42), rgba(214,190,160,0) 70%);}

/* ---------- 山水手繪插畫 ---------- */
.landscape{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  opacity:.82;
}
.landscape svg{width:100%;height:100%;display:block;}
.mountain{fill:url(#mtnWash);}
.mountain--back{fill:url(#mtnBack);opacity:.85;}
.mist-band{fill:#faf7ee;opacity:.55;}
.ridge{fill:none;stroke:#6f7f76;stroke-width:1.1;stroke-linecap:round;opacity:.38;}
.pine{fill:none;stroke:#4d6157;stroke-width:1.3;stroke-linecap:round;opacity:.45;}
.tea-leaf{opacity:.4;}
.sprinkle{opacity:.32;}

/* ---------- 版面 ---------- */
.wrap{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding:18px 16px 40px;}
@media (min-width:900px){ .wrap{padding:26px 40px 56px;} }

.topbar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:14px;}
.ghost-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:999px;
  font-size:15px;line-height:1.4;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(79,125,106,.3);
  color:#3f5f52;
  backdrop-filter:blur(4px);
  transition:background .2s ease,border-color .2s ease;
}
.ghost-btn:hover{background:rgba(255,255,255,.85);border-color:rgba(79,125,106,.55);}
.ghost-btn svg{width:18px;height:18px;flex-shrink:0;}

.hero{
  position:relative;
  padding:18px 4px 8px;
  max-width:900px;
}
@media (min-width:900px){ .hero{padding:8px 4px 4px;} }
.hero h1{
  font-size:clamp(26px,7vw,46px);
  line-height:1.35;margin:0 0 6px;
  font-weight:700;color:#26352f;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.hero .sub{
  display:inline-block;margin:0;
  font-size:clamp(16px,4.4vw,21px);
  letter-spacing:.14em;color:#41604f;
  padding:2px 0 4px;
  border-bottom:1.5px solid rgba(79,125,106,.32);
}
.hero .intro{
  margin:12px 0 0;max-width:520px;
  font-size:16px;color:var(--ink-soft);
}
.seal{
  position:absolute;right:0;top:4px;
  width:58px;height:58px;border-radius:9px;
  border:1.5px solid rgba(178,86,74,.55);
  color:#a8483f;display:flex;align-items:center;justify-content:center;
  font-family:"Songti TC",serif;font-size:13px;line-height:1.15;
  letter-spacing:0;writing-mode:vertical-rl;
  background:rgba(255,255,255,.35);
  opacity:.85;
}
@media (max-width:640px){ .seal{width:48px;height:48px;font-size:11px;top:0;} }

/* ---------- 卷軸卡片 ---------- */
.scroll-cards{
  margin-top:26px;
  display:grid;grid-template-columns:1fr;gap:22px;
}
@media (min-width:760px){
  .scroll-cards{grid-template-columns:repeat(3,1fr);gap:24px;margin-top:34px;}
}
.scroll-card{
  position:relative;
  display:flex;flex-direction:column;
  text-align:left;
  padding:0;overflow:hidden;
  border-radius:6px;
  background:linear-gradient(180deg, #fffdf6 0%, #fbf6e9 60%, #f6efdd 100%);
  box-shadow:
    0 1px 2px rgba(96,82,60,.06),
    0 6px 14px rgba(96,82,60,.08),
    0 18px 36px rgba(96,82,60,.06);
  transition:transform .28s cubic-bezier(.2,.8,.2,1), box-shadow .28s ease;
  isolation:isolate;
}
.scroll-card::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  border-radius:6px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23p)' opacity='0.13'/></svg>");
  mix-blend-mode:multiply;opacity:.7;
}
/* ---------- 手撕水彩紙毛邊（不遮擋內容） ---------- */
.wash-frame{position:relative;border-radius:7px;}
.wash-frame .edge{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  border-radius:7px;
  box-shadow:inset 0 0 0 1px rgba(150,138,112,.35);
}
.scroll-card:hover{transform:translateY(-3px);
  box-shadow:0 2px 4px rgba(96,82,60,.07),0 12px 22px rgba(96,82,60,.11),0 26px 48px rgba(96,82,60,.07);}
.scroll-card:focus-visible{outline:3px solid rgba(79,125,106,.55);outline-offset:3px;}

.card-body{position:relative;z-index:2;padding:20px 18px 18px;display:flex;flex-direction:column;flex:1;}
.card-art{position:relative;z-index:2;height:132px;overflow:hidden;}
@media (min-width:760px){ .card-art{height:150px;} }
.card-art svg{width:100%;height:100%;display:block;}
.card-kicker{
  position:relative;z-index:2;
  font-size:12.5px;letter-spacing:.22em;color:#7b8b80;
  padding:0 18px;margin-top:4px;
}
.card-title{
  position:relative;z-index:2;
  font-family:"Songti TC","Noto Serif TC",serif;
  font-size:20px;font-weight:700;color:#2c3a34;
  margin:4px 18px 0;line-height:1.5;
}
.card-text{
  position:relative;z-index:2;
  font-size:15.5px;color:#57655c;
  margin:6px 18px 0;flex:1;
}
.card-cta{
  position:relative;z-index:2;
  margin:14px 18px 16px;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:4px;
  font-size:16px;font-weight:600;
  background:rgba(79,125,106,.1);
  border:1px solid rgba(79,125,106,.42);
  color:#35604f;
  transition:background .2s ease,color .2s ease;
}
.scroll-card:hover .card-cta{background:rgba(79,125,106,.9);color:#fdfaf0;border-color:transparent;}
.card-cta svg{width:17px;height:17px;flex-shrink:0;}
.card-num{
  position:absolute;right:14px;bottom:10px;z-index:2;
  font-family:"Songti TC",serif;font-size:13px;color:#a89a80;letter-spacing:.1em;
}

/* ---------- 未設定網址提示 ---------- */
.hint{
  position:relative;z-index:4;
  margin:0 18px 16px;padding:9px 12px;
  font-size:14px;line-height:1.6;
  background:rgba(193,154,91,.13);
  border:1px dashed rgba(160,120,66,.45);
  border-radius:4px;color:#7d5c2e;
  display:none;
}
.hint.show{display:block;}

/* ---------- 設定面板 ---------- */
.panel-mask{
  position:fixed;inset:0;z-index:40;background:rgba(52,60,54,.3);
  backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.panel-mask.open{opacity:1;pointer-events:auto;}
.panel{
  position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(92vw,400px);
  background:linear-gradient(180deg,#fdfaf1,#f6f0e0);
  box-shadow:-8px 0 28px rgba(70,62,48,.16);
  transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
}
.panel.open{transform:translateX(0);}
.panel-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  padding:20px 20px 12px;
}
.panel-head h2{
  font-family:"Songti TC",serif;font-size:20px;margin:0;color:#2c3a34;
}
.panel-head p{margin:4px 0 0;font-size:14px;color:#6b7a71;}
.close-btn{
  width:36px;height:36px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:rgba(79,125,106,.1);color:#3f5f52;
}
.close-btn svg{width:18px;height:18px;}
.panel-body{padding:6px 20px 16px;overflow-y:auto;flex:1;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:14px;font-weight:600;color:#3d4f46;margin-bottom:5px;}
.field input{
  width:100%;padding:9px 11px;font-size:15px;
  border:1px solid rgba(79,125,106,.32);border-radius:5px;
  background:#fffdf7;color:#2f3a36;
}
.field input:focus{outline:2px solid rgba(79,125,106,.45);outline-offset:0;}
.field .tip{display:block;margin-top:4px;font-size:12.5px;color:#8a958d;}
.panel-actions{display:flex;gap:10px;padding:4px 20px 22px;}
.btn-solid,.btn-line{
  flex:1;padding:11px 14px;border-radius:5px;font-size:15px;font-weight:600;text-align:center;
}
.btn-solid{background:#4f7d6a;color:#fdfaf0;}
.btn-solid:hover{background:#446d5c;}
.btn-line{border:1px solid rgba(79,125,106,.4);color:#3f5f52;background:transparent;}
.btn-line:hover{background:rgba(79,125,106,.08);}

/* ---------- 頁腳 ---------- */
.foot{
  position:relative;z-index:1;
  margin-top:34px;padding-top:16px;
  border-top:1px dashed rgba(120,110,90,.28);
  font-size:13.5px;color:#8a8577;
  display:flex;flex-wrap:wrap;gap:6px 16px;
}
.foot span{white-space:nowrap;}

/* ---------- 浮動茶葉妝飾 ---------- */
.leaf-drift{
  position:fixed;z-index:1;pointer-events:none;border-radius:100% 0 100% 0;
  background:linear-gradient(140deg, rgba(122,152,112,.5), rgba(122,152,112,.12));
  opacity:0;
  animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translate3d(0,-8vh,0) rotate(0deg);opacity:0;}
  12%{opacity:.5;}
  88%{opacity:.4;}
  100%{transform:translate3d(-14vw,108vh,0) rotate(220deg);opacity:0;}
}
@media (prefers-reduced-motion:reduce){
  .leaf-drift{display:none;}
  .scroll-card{transition:none;}
}

/* ---------- 水潤暈染背景裝飾 ---------- */
.bloom{
  position:absolute;border-radius:50%;pointer-events:none;
  filter:blur(10px);mix-blend-mode:multiply;
}
</style>

<!-- ============ 連結設定面板 ============ -->
<div class="panel-mask" id="mask"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true">
  <div class="panel-head">
    <div>
      <h2 id="panel-title" class="display">連結設定</h2>
      <p>貼上原有網頁網址，按一下圖卡即可開啟。</p>
    </div>
    <button class="close-btn" id="closePanel" aria-label="關閉設定面板">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="panel-body">
    <div class="field">
      <label for="link0">卷一 · 茶文化互動遊戲</label>
      <input id="link0" type="url" inputmode="url" placeholder="例如：https://example.com/tea-game" autocomplete="off">
      <span class="tip">可留空，稍後再設定。</span>
    </div>
    <div class="field">
      <label for="link1">卷二 · 《中國茶》繪本互動遊戲</label>
      <input id="link1" type="url" inputmode="url" placeholder="例如：https://example.com/tea-story-game" autocomplete="off">
      <span class="tip">可留空，稍後再設定。</span>
    </div>
    <div class="field">
      <label for="link2">卷三 · 《中國茶》繪本影片</label>
      <input id="link2" type="url" inputmode="url" placeholder="例如：https://example.com/tea-story-video" autocomplete="off">
      <span class="tip">可留空，稍後再設定。</span>
    </div>
  </div>

  <div class="panel-actions">
    <button class="btn-solid" id="saveLinks">儲存設定</button>
    <button class="btn-line" id="clearLinks">清除</button>
  </div>
</aside>

<script>
(function(){
  'use strict';
  var KEY = 'tea-classroom-links-v1';
  var inputs = [document.getElementById('link0'), document.getElementById('link1'), document.getElementById('link2')];
  var cards = Array.prototype.slice.call(document.querySelectorAll('.scroll-card'));
  var hints = [document.getElementById('hint-0'), document.getElementById('hint-1'), document.getElementById('hint-2')];
  var panel = document.getElementById('panel');
  var mask = document.getElementById('mask');
  var openBtn = document.getElementById('openPanel');
  var closeBtn = document.getElementById('closePanel');
  var saveBtn = document.getElementById('saveLinks');
  var clearBtn = document.getElementById('clearLinks');
  var toast = null;

  function safeGet(){
    try{
      var raw = window.localStorage.getItem(KEY);
      if(!raw) return ['','',''];
      var arr = JSON.parse(raw);
      if(!Array.isArray(arr)) return ['','',''];
      return [0,1,2].map(function(i){ return typeof arr[i] === 'string' ? arr[i] : ''; });
    }catch(e){ return ['','','']; }
  }

  function safeSet(list){
    try{ window.localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch(e){ return false; }
  }

  function safeRemove(){
    try{ window.localStorage.removeItem(KEY); }catch(e){}
  }

  function isUrl(v){
    if(!v) return false;
    return /^https?:\/\/[^\s.]+\.[^\s]+$/i.test(v.trim());
  }

  function openUrl(url){
    if(isUrl(url)){
      window.open(url.trim(), '_blank', 'noopener');
      return true;
    }
    return false;
  }

  function showToast(msg){
    if(toast){ toast.parentNode.removeChild(toast); toast = null; }
    var d = document.createElement('div');
    d.textContent = msg;
    d.setAttribute('role','status');
    d.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;'
      + 'padding:10px 18px;border-radius:8px;font-size:15px;max-width:82vw;text-align:center;'
      + 'background:#3f5f52;color:#fdfaf0;box-shadow:0 6px 18px rgba(60,70,60,.25);';
    document.body.appendChild(d);
    toast = d;
    window.setTimeout(function(){
      if(toast === d && d.parentNode){ d.parentNode.removeChild(d); toast = null; }
    }, 2600);
  }

  function render(saved){
    cards.forEach(function(card, i){
      var url = saved[i];
      card.setAttribute('data-url', url);
      hints[i].classList.toggle('show', !url);
      card.setAttribute('aria-label',
        (i === 0 ? '茶文化互動遊戲' : (i === 1 ? '中國茶繪本互動遊戲' : '中國茶繪本影片')) +
        (url ? '，點擊開啟' : '，尚未設定網址，點擊前往設定')
      );
    });
  }

  function openPanel(){
    var saved = safeGet();
    inputs.forEach(function(inp, i){ inp.value = saved[i]; });
    mask.classList.add('open');
    panel.classList.add('open');
    panel.setAttribute('aria-hidden','false');
    openBtn.setAttribute('aria-expanded','true');
    window.setTimeout(function(){ inputs[0].focus(); }, 260);
  }

  function closePanel(){
    mask.classList.remove('open');
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden','true');
    openBtn.setAttribute('aria-expanded','false');
    openBtn.focus();
  }

  cards.forEach(function(card, i){
    card.addEventListener('click', function(){
      var url = card.getAttribute('data-url') || '';
      if(openUrl(url)) return;
      if(!url){
        openPanel();
        window.setTimeout(function(){ inputs[i].focus(); }, 280);
        return;
      }
      showToast('網址格式不正確，請重新設定。');
      openPanel();
      window.setTimeout(function(){ inputs[i].focus(); }, 280);
    });
  });

  openBtn.addEventListener('click', openPanel);
  closeBtn.addEventListener('click', closePanel);
  mask.addEventListener('click', closePanel);

  saveBtn.addEventListener('click', function(){
    var list = inputs.map(function(inp){ return inp.value.trim(); });
    var ok = safeSet(list);
    render(list);
    closePanel();
    showToast(ok ? '已儲存設定。' : '無法儲存在此瀏覽器，設定暫時生效。');
  });

  clearBtn.addEventListener('click', function(){
    inputs.forEach(function(inp){ inp.value = ''; });
    safeRemove();
    render(['','','']);
    showToast('已清除全部連結。');
  });

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && panel.classList.contains('open')) closePanel();
  });

  // 首次載入：讀取本機設定
  render(safeGet());
})();
</script>

<script>
// 飄落茶葉妝飾（最多 9 片，動畫上限 1 次播放）
(function(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var layer = document.body;
  for(var i = 0; i < 9; i++){
    var leaf = document.createElement('div');
    leaf.className = 'leaf-drift';
    var size = 9 + (i % 4) * 3;
    leaf.style.width = size + 'px';
    leaf.style.height = (size * 1.6) + 'px';
    leaf.style.left = (6 + i * 10.5) + 'vw';
    leaf.style.animationDuration = (22 + (i % 5) * 5) + 's';
    leaf.style.animationDelay = (-i * 4.4) + 's';
    layer.appendChild(leaf);
    (function(el){
      el.addEventListener('animationend', function(){
        if(el.parentNode) el.parentNode.removeChild(el);
      });
    })(leaf);
  }
})();
</script>
